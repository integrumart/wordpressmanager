- Menghapus pustaka 'requests' eksternal untuk menjamin kompatibilitas silang Python 64-bit dan 32-bit secara penuh untuk NVDA 2026.1 dan NVDA 2025.x.
- Restrukturisasi arsitektur add-on agar sesuai dengan templat Add-on NVDA standar."""
